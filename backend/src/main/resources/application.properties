spring.application.name=rupeetrack-api
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/rupeetrack
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen3:4b
spring.ai.ollama.chat.options.temperature=0.1
spring.ai.ollama.chat.think=false
spring.ai.ollama.chat.keep-alive=30m
spring.ai.ollama.chat.options.num-predict=128

logging.level.org.springframework.ai=DEBUG